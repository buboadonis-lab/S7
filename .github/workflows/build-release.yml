name: Build Android APK

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/s7-health-scanner.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: s7-health-scanner-apk
          path: dist/s7-health-scanner.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.5"
          {
            echo "S7 Health Scanner v1.0.5"
            echo ""
            echo "## What's included"
            echo "- Android APK: \`s7-health-scanner.apk\`"
            echo "- Manual-only storage scan control"
            echo "- Persistent healthy/bad sector map: unverified sectors treated as UNHEALTHY by default"
            echo "- Crash/power-off during scan marks in-progress sector/chunk as PERMANENTLY UNUSABLE (never rescanned)"
            echo "- Boot receiver notification (health guard starts on boot)
            echo "- Memory card manager: export badblocks map, root-only tagging via e2fsck -l on UNMOUNTED ext2/3/4 partitions""
            echo "- File-level scan with bit-by-bit pattern verification"
            echo "- Root-based raw block scan (read-only, via su/dd)"
            echo "- Damaged file quarantine and scan report export"
            echo ""
            echo "## Notes"
            echo "- Android apps cannot force other apps to use specific physical sectors; OS/filesystem-level enforcement requires root/system support."
            echo "- Raw block scan requires root and performs read-only block reads."
            echo "- Physical bad-sector remapping cannot be performed by an unprivileged Android app."
          } > /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading asset..."
            gh release upload "$TAG" dist/s7-health-scanner.apk --clobber
          else
            gh release create "$TAG" dist/s7-health-scanner.apk \
              --target "${{ github.sha }}" \
              --title "v1.0.5 - S7 Health Scanner" \
              --notes-file /tmp/release-notes.md
          fi
